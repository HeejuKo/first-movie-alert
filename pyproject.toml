[project]
name = "movie-alert"
version = "0.1.0"
description = "설정에 맞는 영화 첫 상영 회차를 조회하는 Movie Alert"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.40,<2", "httpx>=0.28,<0.29"]

[project.scripts]
movie-alert = "movie_alert.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movie_alert"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
