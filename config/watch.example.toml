# 브라우저에서 확인한 요청의 값. 코드 의미와 다른 값의 지원 범위는 미확인.
[cgv]
co_cd = "A420"
rtctl_scop_cd = "08"
# CGV 직접 호출이 403으로 제한되어 공개 시간표 릴레이를 사용한다.
# 릴레이는 제3자 서비스이며 응답이 지연되거나 중단될 수 있다.
source = "mcp_relay"
relay_base_url = "https://mcp.aka.page"

[http]
timeout_seconds = 10.0
max_retries = 0
retry_delay_seconds = 0.5
max_parallel_requests = 3

# 이 날짜 목록을 바꾸면 아래 모든 등록 지점에 적용된다.
# 지정한 날짜만 조회한다. weekdays를 생략하면 요일 제한을 두지 않는다.
[watch_defaults]
dates = ["2026-10-28", "2026-10-31", "2026-11-04", "2026-11-07"]
provider = "cgv"
movie_name = "극장판 치이카와-인어 섬의 비밀"
movie_id = "30001367"
session_policy = "earliest"
enabled = true
active_from = 2026-10-21T00:00:00+09:00
active_until = 2026-11-08T00:00:00+09:00 # 이 시각 미만까지 실행

# 지점 ID는 사용자가 CGV 화면에서 확인해 제공한 값이다.
# 각 지점의 독립 조회 응답과 자동 접근 가능 여부는 별도로 검증해야 한다.
[[watches]]
name = "치이카와-강남"
branch_name = "CGV 강남"
branch_id = "0056"

[[watches]]
name = "치이카와-강변"
branch_name = "CGV 강변"
branch_id = "0001"

[[watches]]
